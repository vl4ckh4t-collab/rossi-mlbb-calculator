<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e6f1ff">
<title>ROSSI MLBB Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="heading">
    <div class="brand">🌸 ROSSI MLBB Calculator</div>
    <div class="sub">MLBB Diamond · MLBB Diamond Price & Profit Calculator</div>
  </header>

  <nav class="theme-picker" aria-label="Choose theme">
    <button type="button" class="theme-btn blue" data-theme="blue">💙 Blue</button>
    <button type="button" class="theme-btn sakura" data-theme="sakura">🌸 Sakura</button>
    <button type="button" class="theme-btn mint" data-theme="mint">🍃 Mint</button>
    <button type="button" class="theme-btn peach" data-theme="peach">💗 Peach</button>
  </nav>

  <section class="controls">
    <label for="smileRate">Smile Code ဈေးနှုန်း ထည့်ပါ / Enter Smile Code Rate (MMK per Coin)</label>
    <input id="smileRate" type="number" min="0" step="any" placeholder="ဥပမာ - 7*****" inputmode="decimal">
    <label for="profitRate">အမြတ် % ရွေးပါ / Select Profit %</label>
    <select id="profitRate" aria-label="Profit percentage">
      <!-- options are generated in 0.5% increments by script.js -->
    </select>
  </section>

  <nav class="quick-tabs" aria-label="Telegram links">
    <a class="quick-tab" href="https://t.me/diamondshop644" target="_blank" rel="noopener">📢 Channel Join</a>
    <a class="quick-tab" href="https://t.me/diamondshop64" target="_blank" rel="noopener">👥 Resell Gp</a>
    <a class="quick-tab" href="https://t.me/enola257" target="_blank" rel="noopener">💎 Diamond ဝယ်မယ်</a>
  </nav>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>No.</th><th>Dia Plan</th><th>Org Dia Plan</th><th>Coin Price</th>
          <th>MMK Result</th><th>အမြတ် / Profit</th><th>Total MMK</th>
        </tr>
      </thead>
      <tbody id="plans"></tbody>
    </table>
  </div>
  <footer>
    <span>🌸 Powered by <a href="https://t.me/enola257" target="_blank" rel="noopener">@enola257</a></span>
    <span>ROSSI MLBB Calculator</span>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
